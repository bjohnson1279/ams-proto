services:
  ams-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ams_prototype_api
    restart: unless-stopped
    ports:
      - "6000:6000"
    environment:
      - NODE_ENV=development
      - PORT=6000
      - DATABASE_URL=postgres://ams_admin:ams_password@postgres:5432/ams_prototype
    volumes:
      - ./src:/app/src
      - ./sample_payloads:/app/sample_payloads
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:6000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: ams_postgres
    environment:
      POSTGRES_USER: ams_admin
      POSTGRES_PASSWORD: ams_password
      POSTGRES_DB: ams_prototype
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

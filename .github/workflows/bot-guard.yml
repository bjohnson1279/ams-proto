name: Automated Bot Guardrail

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  audit-bot-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: contains(github.actor, 'jules') || contains(github.actor, 'sentinel') || contains(github.actor, 'bolt') || contains(github.actor, 'palette') || contains(github.head_ref, 'sentinel') || contains(github.head_ref, 'jules') || contains(github.head_ref, 'bolt') || contains(github.head_ref, 'palette')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Diff Statistics for Destructive Changes
        run: |
          echo "=== Auditing PR Diff for Bot Regressions & Hallucinations ==="

          # Check for zero-diff or hallucinatory acknowledgment PRs
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -v '^\.jules/' | grep -v 'package.*json' | grep -v 'composer\.lock' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "❌ ERROR: PR contains 0 code changes (hallucinatory task acknowledgment). Auto-failing."
            exit 1
          fi

          # Check for forbidden scratch files
          SCRATCH_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^test(_.*)?\.(ts|js|sh)$|\.scratch$|plan\.md$' || true)
          if [ -n "$SCRATCH_FILES" ]; then
            echo "❌ ERROR: PR contains forbidden scratch verification files:"
            echo "$SCRATCH_FILES"
            exit 1
          fi

          # Check for line deletions in critical schema files
          DELETED_LINES=$(git diff --stat origin/${{ github.base_ref }}...HEAD | grep -E 'schema\.prisma|src/index\.ts|public/index\.php|docker/postgres/init/' | awk '{print $5}' | grep '-' || true)
          for count in $DELETED_LINES; do
            num=$(echo "$count" | tr -d '-')
            if [ "$num" -gt 15 ]; then
              echo "❌ ERROR: PR deletes $num lines from a core schema or entrypoint file, exceeding safety threshold (max 15)."
              exit 1
            fi
          done

          # Check for unresolved merge conflict markers
          CONFLICTS=$(git diff origin/${{ github.base_ref }}...HEAD | grep -E '^\+\s*(\<{7}|\={7}|\>{7}|\|{7})' || true)
          if [ -n "$CONFLICTS" ]; then
            echo "❌ ERROR: PR adds unresolved Git merge conflict markers (<<<<<<<, =======, >>>>>>>). Auto-failing."
            echo "$CONFLICTS"
            exit 1
          fi

          # Verify that substantive application changes (src/ or public/) are accompanied by tests
          APP_CHANGES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(src|public)/' || true)
          TEST_CHANGES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^tests/' || true)
          if [ -n "$APP_CHANGES" ] && [ -z "$TEST_CHANGES" ]; then
            echo "⚠️ NOTICE: PR modifies application source files without accompanying updates in tests/ directory."
            echo "Bot authors should ensure behavioral changes, optimizations, and bug fixes include automated tests."
          fi

          echo "✅ Bot Guardrail Passed."

      - name: Enable Auto-Merge for Validated Bot PRs
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to enable auto-merge for PR #${{ github.event.pull_request.number }}..."
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash || echo "Auto-merge could not be set automatically (check repository auto-merge settings)."

